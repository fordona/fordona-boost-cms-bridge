[project]
name = "fordona-connect"
version = "0.1.0"
description = "Theory content API for the Fordona Theory App, backed by the Boost CMS delivery API."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.15.1",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
    # python:3.12-slim (this project's own Docker base) has no system IANA tz
    # database, and neither does Windows — zoneinfo.ZoneInfo("UTC") itself fails
    # without this. Pure-Python data, works identically everywhere.
    "tzdata>=2026.1",
]

[dependency-groups]
dev = [
    "fakeredis>=2.39.0",
    "import-linter>=2.3",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.17.0",
    "testcontainers[postgres]>=4.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Deliberately excludes src/boost_stub: the `runtime` Docker stage must never
# carry it (plan §4.5). The `boost-stub` stage runs it from source instead
# (see the Dockerfile) — it is a separate deployable, not a second package of
# this project.
packages = ["src/fordona_connect"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "S", "RUF", "N", "PT"]
ignore = ["S101"]  # assert is fine in tests; production code never uses it for control flow

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]  # fixture tokens are not secrets
"migrations/**" = ["N999"]

[tool.importlinter]
root_packages = ["fordona_connect", "boost_stub"]

[[tool.importlinter.contracts]]
# The BFF and the Boost stub are separate deployables (plan §4.5): one
# contract test suite, two implementations. Neither may depend on the other's
# internals, or a change to one could silently break the other at runtime.
name = "The BFF and the Boost stub never import each other"
type = "independence"
modules = ["fordona_connect", "boost_stub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs Docker (Postgres via testcontainers)",
    "contract: Boost content API v1 contract suite (needs CONTRACT_BOOST_BASE_URL + tokens)",
]

[tool.coverage.run]
source = ["fordona_connect"]
branch = true

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
