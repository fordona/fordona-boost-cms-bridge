services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bridge
      POSTGRES_PASSWORD: bridge
      POSTGRES_DB: boost_bridge
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bridge -d boost_bridge"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  migrate:
    build: { context: ., target: runtime }
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://bridge:bridge@postgres:5432/boost_bridge
    depends_on:
      postgres: { condition: service_healthy }

  app:
    build: { context: ., target: runtime }
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://bridge:bridge@postgres:5432/boost_bridge
      REDIS_URL: redis://redis:6379/0
      BOOST_BASE_URL: http://boost-stub:8080
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    networks: [default, dokploy-network]

  boost-stub:
    build: { context: ., target: boost-stub }
    env_file: .env

networks:
  dokploy-network:
    external: true

volumes:
  pgdata: