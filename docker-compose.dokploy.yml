services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: connect
      POSTGRES_PASSWORD: connect
      POSTGRES_DB: fordona_connect
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U connect -d fordona_connect"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  migrate:
    build: { context: ., target: runtime }
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://connect:connect@postgres:5432/fordona_connect
    depends_on:
      postgres: { condition: service_healthy }

  app:
    build: { context: ., target: runtime }
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://connect:connect@postgres:5432/fordona_connect
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    networks: [default, dokploy-network]

networks:
  dokploy-network:
    external: true

volumes:
  pgdata: