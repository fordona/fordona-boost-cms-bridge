# Local development stack: Postgres + Redis, and the app itself.
#   docker compose up -d postgres redis      # dependencies only, run the app with uv
#   docker compose up --build                # everything
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: connect
      POSTGRES_PASSWORD: connect
      POSTGRES_DB: fordona_connect
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U connect -d fordona_connect"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  migrate:
    build: { context: ., target: runtime }
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://connect:connect@postgres:5432/fordona_connect
    depends_on:
      postgres: { condition: service_healthy }
    profiles: ["app"]

  app:
    build: { context: ., target: runtime }
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://connect:connect@postgres:5432/fordona_connect
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    profiles: ["app"]

volumes:
  pgdata:
